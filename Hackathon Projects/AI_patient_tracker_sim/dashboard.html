<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Room - Real-Time Patient Risk Monitoring</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            z-index: 100;
        }
        #info h2 {
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .patient-info {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 14px;
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 12px;
        }
        .status-normal { background: #4CAF50; color: white; }
        .status-low { background: #FFEB3B; color: black; }
        .status-medium { background: #FF9800; color: white; }
        .status-high { background: #F44336; color: white; }
        #timer {
            font-size: 18px;
            margin: 15px 0;
            padding: 10px;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 5px;
            text-align: center;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid white;
        }
        #smsLog {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            max-width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
        }
        #smsLog h3 {
            margin-top: 0;
            border-bottom: 2px solid #F44336;
            padding-bottom: 10px;
        }
        .sms-message {
            background: rgba(244, 67, 54, 0.3);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #F44336;
            font-size: 13px;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #888;
            cursor: not-allowed;
        }
        button.sms-button {
            background: #F44336;
        }
        button.sms-button:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h2>🏥 Patient Monitoring</h2>
        <div id="timer">Initializing...</div>
        <div id="patientList">Loading patient data...</div>
    </div>

    <div id="smsLog">
        <h3>📞 Voice Call Alerts</h3>
        <div id="smsMessages">Automated voice call will be placed to alert medical staff...</div>
    </div>

    <div id="legend">
        <h3 style="margin-top: 0;">Risk Level Legend</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: white;"></div>
            <span>Pending Analysis</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4CAF50;"></div>
            <span>Normal</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FFEB3B;"></div>
            <span>Low Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF9800;"></div>
            <span>Medium Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #F44336;"></div>
            <span>High Risk</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="resetSimulation()">🔄 Re-run Simulation</button>
        <button class="sms-button" onclick="showCallInfo()">📞 Voice Call Info</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Patient data will be loaded from our server
        let patientData = [];
        // This will hold the 6 patients for the current simulation
        let shuffledPatients = [];

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 8, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const pointLight1 = new THREE.PointLight(0x4CAF50, 0.5, 20);
        pointLight1.position.set(-5, 5, 0);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x2196F3, 0.5, 20);
        pointLight2.position.set(5, 5, 0);
        scene.add(pointLight2);

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x2c3e50,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Create beds and spheres
        const beds = [];
        const spheres = [];
        const bedPositions = [
            [-6, -1.5, -3],
            [-6, -1.5, 3],
            [0, -1.5, -3],
            [0, -1.5, 3],
            [6, -1.5, -3],
            [6, -1.5, 3]
        ];

        bedPositions.forEach((pos, index) => {
            const bedGroup = new THREE.Group();
            
            const mattressGeometry = new THREE.BoxGeometry(2, 0.3, 3);
            const mattressMaterial = new THREE.MeshStandardMaterial({
                color: 0xecf0f1,
                roughness: 0.7
            });
            const mattress = new THREE.Mesh(mattressGeometry, mattressMaterial);
            mattress.castShadow = true;
            mattress.receiveShadow = true;
            bedGroup.add(mattress);

            const frameGeometry = new THREE.BoxGeometry(2.2, 0.2, 3.2);
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0x34495e,
                metalness: 0.6
            });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.y = -0.25;
            frame.castShadow = true;
            bedGroup.add(frame);
            
            bedGroup.position.set(pos[0], pos[1], pos[2]);
            scene.add(bedGroup);
            beds.push(bedGroup);

            const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const sphereMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.3,
                roughness: 0.3,
                metalness: 0.7
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(pos[0], pos[1] + 3, pos[2]);
            sphere.castShadow = true;
            scene.add(sphere);
            spheres.push(sphere);

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, 256, 128);
            ctx.font = 'Bold 40px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(`Bed ${index + 1}`, 128, 70);
            
            const texture = new THREE.CanvasTexture(canvas);
            const labelMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true
            });
            const labelGeometry = new THREE.PlaneGeometry(2, 1);
            const label = new THREE.Mesh(labelGeometry, labelMaterial);
            label.position.set(pos[0], pos[1] + 4.5, pos[2]);
            scene.add(label);
        });

        let startTime = Date.now();
        let predictionsMade = false;
        let smsAlerts = [];

        const riskColors = {
            'Normal': 0x4CAF50,
            'Low': 0xFFEB3B,
            'Medium': 0xFF9800,
            'High': 0xF44336
        };

        function showCallInfo() {
            let highRiskPatients = shuffledPatients.filter(p => p.predicted === 'High');
            let num_patients = highRiskPatients.length;
            let patient_list_str = highRiskPatients.map(p => `Patient ${p.id.split('').join(' ')} is at high risk.`).join('\n   ');

            let message = `📞 VOICE CALL ALERT INFO
(This is a summary of the call triggered by the Python server)

From: +1 (724) 246-6544
To: +1 (714) 367-6750

--- Voice Message ---
"Alert from Hospital Patient Monitoring System.
   There are ${num_patients} patients at high risk.
   ${patient_list_str}
   Please respond immediately."
--- End of Message ---
`;
            alert(message);
        }

        function addSMSMessage(message, type, source) {
            const time = new Date().toLocaleTimeString();
            smsAlerts.push({
                message: message,
                time: time,
                type: type,
                source: source
            });
            updateSMSLog();
        }

        function updateSMSLog() {
            const smsMessagesDiv = document.getElementById('smsMessages');
            if (smsAlerts.length === 0) {
                smsMessagesDiv.innerHTML = 'Awaiting analysis...';
            } else {
                // Show latest alerts first
                smsMessagesDiv.innerHTML = smsAlerts.map(alert => `
                    <div class="sms-message ${alert.type}">
                        <strong>📱 ${alert.time}</strong><br>
                        ${alert.source ? `From: ${alert.source}<br>` : ''}
                        ${alert.message}
                    </div>
                `).reverse().join('');
            }
        }

        function updatePatientList() {
            const patientListDiv = document.getElementById('patientList');
            patientListDiv.innerHTML = shuffledPatients.map(patient => {
                const statusClass = predictionsMade ? 
                    `status-${patient.predicted.toLowerCase()}` : '';
                const statusText = predictionsMade ? patient.predicted : 'Analyzing...';
                
                return `
                    <div class="patient-info">
                        <strong>Bed ${patient.bed}: ${patient.id}</strong><br>
                        Status: <span class="status ${statusClass}">${statusText}</span>
                        ${predictionsMade ? 
                            `(Actual: <span class="status status-${patient.actual.toLowerCase()}">${patient.actual}</span>)` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateTimer() {
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, 5 - elapsed);
            
            if (!predictionsMade && remaining > 0) {
                document.getElementById('timer').innerHTML = 
                    `⏱️ Analysis in progress: ${remaining.toFixed(1)}s`;
            } else if (!predictionsMade) {
                document.getElementById('timer').innerHTML = 
                    '✅ Analysis Complete!';
                makePredictions();
            } else {
                document.getElementById('timer').innerHTML = 
                    '✅ Monitoring Active';
            }
        }

        function makePredictions() {
            predictionsMade = true;
            
            spheres.forEach((sphere, index) => {
                const patient = shuffledPatients[index];
                sphere.userData.patientId = patient.id;
                const riskColor = riskColors[patient.predicted];
                
                const startColor = new THREE.Color(0xffffff);
                const endColor = new THREE.Color(riskColor);
                let progress = 0;
                
                const colorInterval = setInterval(() => {
                    progress += 0.05;
                    if (progress >= 1) {
                        clearInterval(colorInterval);
                        progress = 1;
                    }
                    
                    const currentColor = startColor.clone().lerp(endColor, progress);
                    sphere.material.color = currentColor;
                    sphere.material.emissive = currentColor;
                    sphere.material.emissiveIntensity = 0.5;
                }, 30);
                
                if (patient.predicted === 'High') {
                    setTimeout(() => {
                        addSMSMessage(
                            `High risk: Patient ${patient.id}. Voice call initiated.`,
                            'simulated',
                            'Voice System'
                        );
                    }, 500 + index * 200);
                }
            });
            
            updatePatientList();
        }
        
        // This is the NEW "Re-run" function
        async function resetSimulation() {
            console.log("Re-run clicked! Requesting new analysis from server...");

            // 1. Show loading state
            document.getElementById('timer').innerHTML = 
                `⏱️ Running new ML analysis...`;
            document.getElementById('patientList').innerHTML = 'Loading new patients...';
            addSMSMessage('Requesting new analysis from server...', 'simulated', 'System');


            // 2. Disable button to prevent multiple clicks
            const button = document.querySelector('.controls button');
            button.disabled = true;
            button.innerHTML = '🔄 Running...';
            
            try {
                // 3. Call your new Python server API
                const response = await fetch('/run-analysis', {
                    method: 'POST',
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }
                
                const newPatientData = await response.json();
                console.log("Received new patient data:", newPatientData);

                // 4. Reset the simulation with the NEW data
                startTime = Date.now();
                predictionsMade = false;
                
                // 5. Map new data to the format your dashboard expects
                patientData = newPatientData.map(p => ({
                    id: p.Patient_ID,
                    actual: p.Actual_Risk,
                    predicted: p.Predicted_Risk
                }));

                // 6. Reset sphere colors
                spheres.forEach(sphere => {
                    sphere.material.color = new THREE.Color(0xffffff);
                    sphere.material.emissive = new THREE.Color(0xffffff);
                    sphere.material.emissiveIntensity = 0.3;
                });

                // 7. Re-shuffle and assign new patients to beds
                shuffledPatients = [...patientData].sort(() => Math.random() - 0.5);
                shuffledPatients.forEach((patient, index) => {
                    patient.bed = index + 1;
                });
                
                // 8. Update list and start animations
                updatePatientList();
                
            } catch (error) {
                console.error("Failed to run new analysis:", error);
                document.getElementById('timer').innerHTML = 
                    `❌ Error. Check server terminal.`;
                addSMSMessage('Error running analysis. Check server terminal.', 'simulated', 'System');
            }

            // 9. Re-enable the button
            button.disabled = false;
            button.innerHTML = '🔄 Re-run Simulation';
        }

        // This function runs on first page load
        async function loadPatientDataAndStart() {
            // Run the main analysis function on the *first page load*
            await resetSimulation();
            
            // Start the animations
            animate();
        }


        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            spheres.forEach((sphere, index) => {
                const offset = index * Math.PI / 3;
                sphere.position.y = bedPositions[index][1] + 3 + Math.sin(time + offset) * 0.15;
                sphere.rotation.y += 0.005;
            });
            
            pointLight1.position.x = Math.sin(time * 0.5) * 8;
            pointLight1.position.z = Math.cos(time * 0.5) * 8;
            pointLight2.position.x = Math.sin(time * 0.5 + Math.PI) * 8;
            pointLight2.position.z = Math.cos(time * 0.5 + Math.PI) * 8;
            
            camera.position.x = Math.sin(time * 0.1) * 2;
            camera.lookAt(0, 0, 0);
            
            updateTimer();
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        loadPatientDataAndStart();
    </script>
</body>
</html>
